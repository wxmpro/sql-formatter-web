name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest "Flask>=3.0.0"

      - name: 黄金用例 + 接口测试 + 历史 Bug 回归
        run: python -m pytest tests/ -v

      - name: 幂等性 / 语义等价 / 孤儿行 回归门禁
        run: python tools/regression_check.py
